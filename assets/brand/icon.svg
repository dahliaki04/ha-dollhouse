<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="20%" r="80%">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.45" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- roof -->
  <path d="M256 44 L484 226 H28 Z" fill="url(#roof)"/>
  <!-- chimney -->
  <rect x="356" y="96" width="40" height="70" rx="6" fill="#1e293b"/>

  <!-- body / outer walls -->
  <rect x="60" y="214" width="392" height="262" rx="22" fill="#334155"/>

  <!-- interior: four rooms in a cut-away front -->
  <!-- top-left: lit room -->
  <rect x="88" y="240" width="164" height="104" rx="8" fill="url(#glow)"/>
  <circle cx="170" cy="258" r="9" fill="#ffffff"/>
  <!-- top-right: bedroom -->
  <rect x="260" y="240" width="164" height="104" rx="8" fill="#e2e8f0"/>
  <rect x="300" y="290" width="92" height="40" rx="8" fill="#cbd5e1"/>
  <rect x="308" y="296" width="24" height="14" rx="4" fill="#ffffff"/>
  <!-- bottom-left: living -->
  <rect x="88" y="352" width="164" height="96" rx="8" fill="#e2e8f0"/>
  <rect x="112" y="398" width="116" height="32" rx="10" fill="#94a3b8"/>
  <rect x="112" y="388" width="116" height="16" rx="8" fill="#64748b"/>
  <!-- bottom-right: kitchen with window -->
  <rect x="260" y="352" width="164" height="96" rx="8" fill="#e2e8f0"/>
  <rect x="352" y="366" width="52" height="40" rx="6" fill="#7dd3fc"/>
  <rect x="284" y="412" width="72" height="20" rx="4" fill="#94a3b8"/>

  <!-- door on the base -->
  <rect x="236" y="404" width="40" height="44" rx="6" fill="#0f172a" opacity="0.0"/>
</svg>
